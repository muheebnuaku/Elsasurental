name: Trip reminders

# Calls /api/cron/reminders every 15 minutes. Runs here instead of a Vercel cron because
# Vercel Hobby only allows daily crons. GitHub may start a run a few minutes late; the
# reminder windows in the route are wide enough for that.
# Repo → Settings → Secrets and variables → Actions: add SITE_URL and CRON_SECRET.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the reminders endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET secret not set yet, skipping."
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/reminders"
